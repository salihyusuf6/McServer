# Nova kasalari. Odul bicimleri (son alan her zaman agirliktir):
#   ITEM:<MATERYAL>:<adet>:<agirlik>
#   MONEY:<tutar>:<agirlik>            (en fazla 100.000)
#   DUST:<toz>:<agirlik>               (Yildiz Tozu)
#   COMMAND:<IKON>:<etiket>:<konsol komutu>:<agirlik>   (komut ':' iceremez, %player% = oyuncu)
# Olasilik = agirlik / kasadaki toplam agirlik. Her kasada toplam 100 tutuldu.
# Beklenen deger (EV) anahtarin nadirligine gore ayarlandi:
#   Yorunge ~1.600  |  Yildiz Hasadi ~3.100  |  Supernova ~12.700  |  Spawner ~53.000 para esdegeri
